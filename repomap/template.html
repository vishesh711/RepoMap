<title>__TITLE__</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: three-pane workspace. Sidebar (flows + filters) | map canvas on survey grid | inspector (details, storyline, code). */
:root {
  --bg: #F3F5F8; --panel: #FFFFFF; --ink: #19202C; --muted: #5A6476; --faint: #8A93A4;
  --line: #DCE1E8; --grid: #E3E7ED; --hover: #EEF1F6;
  --entry: #B26B12; --fn: #4552C9; --cls: #0E7671; --data: #B04A22; --guess: #8A93A4; --err: #B4233C;
  --code-bg: #F6F7FA; --kw: #8436B8; --str: #1F7A3E; --com: #8A93A4; --num: #B04A22;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1219; --panel: #151A23; --ink: #E3E7EE; --muted: #9AA3B3; --faint: #6B7487;
  --line: #262D3A; --grid: #1A202B; --hover: #1D2430;
  --entry: #E5A84A; --fn: #8E98F6; --cls: #4EC2B9; --data: #EC8A60; --guess: #6B7487; --err: #F2788C;
  --code-bg: #10151D; --kw: #C79BEA; --str: #79C78F; --com: #6B7487; --num: #EC8A60;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1219; --panel: #151A23; --ink: #E3E7EE; --muted: #9AA3B3; --faint: #6B7487;
  --line: #262D3A; --grid: #1A202B; --hover: #1D2430;
  --entry: #E5A84A; --fn: #8E98F6; --cls: #4EC2B9; --data: #EC8A60; --guess: #6B7487; --err: #F2788C;
  --code-bg: #10151D; --kw: #C79BEA; --str: #79C78F; --com: #6B7487; --num: #EC8A60;
  color-scheme: dark; }

[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font-ui); }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
code, .mono { font-family: var(--font-code); }

.app { height: 100%; display: grid; grid-template-columns: 264px minmax(0, 1fr) 380px;
  grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "top top top" "side map insp"; }
.top { grid-area: top; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand b { font-family: var(--font-code); font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
.brand span { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.repo { color: var(--fn); font-size: 13px; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.repo:hover { text-decoration: underline; }
.langs { display: flex; gap: 6px; flex-wrap: wrap; }
.lang { font-size: 11.5px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; color: var(--ink); background: var(--bg); }
.lang span { color: var(--faint); font-variant-numeric: tabular-nums; }
.stats { display: flex; gap: 14px; flex-wrap: wrap; margin-left: auto; color: var(--muted); font-size: 12.5px;
  font-variant-numeric: tabular-nums; }
.stats strong { color: var(--ink); font-weight: 600; }

.side { grid-area: side; border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto;
  padding-block: 14px; padding-inline: 14px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint);
  margin: 0 0 6px; }
.search { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.search:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--fn); outline-offset: 1px; }
.results { margin-top: 6px; display: flex; flex-direction: column; max-height: 220px; overflow-y: auto; }
.flows { display: flex; flex-direction: column; gap: 2px; }
.flow { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 8px; align-items: center; text-align: left;
  padding: 6px 8px; border: 0; border-radius: 6px; background: none; cursor: pointer; }
.flow:hover { background: var(--hover); }
.flow:disabled { cursor: default; opacity: 0.6; background: none; }
.flow[aria-pressed="true"] { background: color-mix(in srgb, var(--fn) 12%, transparent); }
.flow .nm { font-family: var(--font-code); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flow .why { grid-column: 2 / 4; font-size: 11.5px; color: var(--muted); margin-top: -3px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flow .ct { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
.glyph { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.toggles { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.toggles label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.legend { display: grid; grid-template-columns: 34px 1fr; gap: 5px 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
.legend svg { overflow: visible; }
.warn { font-size: 12px; color: var(--muted); }

.map { grid-area: map; position: relative; overflow: hidden; touch-action: none;
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px; }
.map svg#canvas { width: 100%; height: 100%; display: block; cursor: grab; }
.map svg#canvas.dragging { cursor: grabbing; }
.mapbar { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; gap: 8px; align-items: center;
  pointer-events: none; flex-wrap: wrap; }
.crumb { pointer-events: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  padding: 5px 10px; font-size: 12.5px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crumb code { font-weight: 600; }
.crumb select { border: 1px solid var(--line); border-radius: 4px; background: var(--bg); padding: 0 4px; font-size: 12px; }
.zoom { pointer-events: auto; margin-left: auto; display: flex; background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; overflow: hidden; }
.zoom button { border: 0; background: none; padding: 5px 10px; cursor: pointer; min-width: 34px; }
.zoom button + button { border-left: 1px solid var(--line); }
.zoom button:hover { background: var(--hover); }
.pad { position: absolute; left: 12px; bottom: 12px; display: grid; grid-template-columns: repeat(3, 30px);
  grid-auto-rows: 30px; gap: 3px; }
.pad button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; cursor: pointer;
  font-size: 11px; color: var(--muted); padding: 0; touch-action: none; user-select: none; }
.pad button:hover { background: var(--hover); color: var(--ink); }
.pad button:active { background: color-mix(in srgb, var(--fn) 14%, var(--panel)); color: var(--ink); }
.mini { position: absolute; right: 12px; bottom: 12px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 4px; cursor: crosshair; line-height: 0; touch-action: none; }
.mini canvas { width: 180px; height: 120px; display: block; }
.hint { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); font-size: 11.5px; color: var(--faint);
  background: color-mix(in srgb, var(--panel) 85%, transparent); padding: 2px 8px; border-radius: 4px;
  pointer-events: none; white-space: nowrap; }
@media (max-width: 1100px) { .hint { display: none; } }
@media (max-width: 520px) { .mini { display: none; } }
.status { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); pointer-events: none; }

.node { cursor: pointer; }
.node text { font-family: var(--font-code); font-size: 12.5px; fill: var(--ink); }
.node .sub { font-family: var(--font-ui); font-size: 11px; fill: var(--muted); }
.node .fld { font-size: 11.5px; fill: var(--muted); }
.node .kw { fill: var(--muted); font-weight: 400; }
.edge path { fill: none; stroke-width: 1.4; }
.edge.calls path { stroke: var(--fn); }
.edge.creates path { stroke: var(--cls); }
.edge.uses path { stroke: var(--faint); stroke-dasharray: 2 4; stroke-width: 1.1; }
.edge.has path { stroke: var(--data); stroke-dasharray: 6 3; }
.edge.extends path { stroke: var(--muted); }
.edge.maybe_calls path { stroke: var(--guess); stroke-dasharray: 5 4; }
.edge.raises path { stroke: var(--err); stroke-dasharray: 1 3; stroke-width: 1.6; stroke-linecap: round; }
.dim { opacity: 0.18; transition: opacity 0.15s; }
.hl path { stroke-width: 2.4; }
.sel > rect.box { stroke-width: 2.6; }

.insp { grid-area: insp; border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); padding-inline: 8px; }
.tabs button { border: 0; background: none; padding: 10px 12px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 500; }
.pane { overflow-y: auto; padding-block: 16px; padding-inline: 16px; flex: 1; min-height: 0; }
.pane h2 { margin: 0; font-family: var(--font-code); font-size: 16px; font-weight: 600; word-break: break-word; text-wrap: balance; }
.kindtag { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
  text-transform: uppercase; margin-bottom: 6px; }
.loc { font-family: var(--font-code); font-size: 12px; color: var(--muted); margin-top: 4px; word-break: break-all; }
.loc a { color: var(--fn); }
.doc { margin: 10px 0 0; color: var(--ink); }
.sig { margin-top: 12px; font-family: var(--font-code); font-size: 12px; background: var(--code-bg); border: 1px solid var(--line);
  border-radius: 6px; padding: 8px 10px; overflow-x: auto; white-space: pre; }
.rels { margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
.rel h3 { margin: 0 0 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--font-code); font-size: 12px; border: 1px solid var(--line); background: var(--bg); border-radius: 5px;
  padding: 2px 8px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; max-width: 100%; }
.chip:hover { border-color: var(--muted); }
.chip .glyph { width: 7px; height: 7px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.btn { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 13px; }
.btn:hover { border-color: var(--muted); }
pre.code { margin: 16px 0 0; font: 12px/1.6 var(--font-code); background: var(--code-bg); border: 1px solid var(--line);
  border-radius: 6px; padding: 10px 0; overflow-x: auto; counter-reset: ln; }
pre.code .l { display: block; padding-inline: 10px 12px; white-space: pre; }
pre.code .l::before { content: attr(data-n); display: inline-block; width: 3.2em; color: var(--faint); text-align: right;
  margin-right: 12px; user-select: none; font-variant-numeric: tabular-nums; }
.t-kw { color: var(--kw); } .t-str { color: var(--str); } .t-com { color: var(--com); font-style: italic; }
.t-num { color: var(--num); } .t-dec { color: var(--entry); } .t-def { color: var(--fn); font-weight: 600; }
.empty { color: var(--muted); }
.story { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.story li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; }
.story .n { font-family: var(--font-code); font-size: 11.5px; color: var(--faint); padding-top: 2px; text-align: right;
  font-variant-numeric: tabular-nums; }
.story .body { border-left: 2px solid var(--line); padding-left: 10px; min-width: 0; }
.story .who { font-family: var(--font-code); font-weight: 600; cursor: pointer; }
.story .who:hover { text-decoration: underline; }
.story .where { font-family: var(--font-code); font-size: 11.5px; color: var(--faint); margin-left: 6px; }
.story p { margin: 2px 0 0; color: var(--muted); }
.story p code { color: var(--ink); cursor: pointer; }
.story p code:hover { text-decoration: underline; }
.intro { color: var(--muted); margin: 0; }

@media (max-width: 1100px) { .app { grid-template-columns: 236px minmax(0, 1fr) 320px; } }
@media (max-width: 860px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto 70vh auto;
    grid-template-areas: "top" "side" "map" "insp"; }
  .side { border-right: 0; border-bottom: 1px solid var(--line); max-height: none; }
  .results, .flows { max-height: 240px; overflow-y: auto; }
  .insp { border-left: 0; border-top: 1px solid var(--line); }
  .pane { overflow: visible; }
  .stats { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { .dim { transition: none; } }
</style>

<div class="app">
  <header class="top">
    <div class="brand"><b>repomap</b><span id="rootName"></span><a id="repoLink" class="repo" hidden target="_blank" rel="noopener"></a></div>
    <div class="langs" id="langs"></div>
    <div class="stats" id="stats"></div>
  </header>

  <aside class="side" aria-label="Flows and filters">
    <div>
      <p class="label"><label for="q">Find a symbol</label></p>
      <input id="q" class="search" type="search" placeholder="Function, class, file…" autocomplete="off">
      <div class="results" id="results"></div>
    </div>
    <div>
      <p class="label">Start from</p>
      <div class="flows" id="flows"></div>
    </div>
    <div>
      <p class="label">Show</p>
      <div class="toggles">
        <label><input type="checkbox" id="tUses" checked> Type references</label>
        <label><input type="checkbox" id="tGuess" checked> Guessed calls</label>
        <label><input type="checkbox" id="tRaise"> Errors raised</label>
        <label><input type="checkbox" id="tFiles"> Group by file</label>

    </div>

      <p class="label">Legend</p>
      <div class="legend" id="legend"></div>
    </div>

  <main class="map" id="map">
    <svg id="canvas" role="img" aria-label="Code map"><g id="vp"></g></svg>
    <div class="mapbar">
      <div class="crumb" id="crumb"></div>
      <div class="zoom">
        <button type="button" id="zIn" aria-label="Zoom in">+</button>
        <button type="button" id="zOut" aria-label="Zoom out">−</button>
        <button type="button" id="zFit">Fit</button>
      </div>
    </div>
    <div class="status" id="status">Laying out the map…</div>
    <div class="pad" role="group" aria-label="Move the map">
      <span></span><button type="button" data-pan="0,1" aria-label="Move up" title="Move up (↑)">▲</button><span></span>
      <button type="button" data-pan="1,0" aria-label="Move left" title="Move left (←)">◀</button>
      <button type="button" id="padHome" aria-label="Back to the start of this flow" title="Back to start (0)">●</button>
      <button type="button" data-pan="-1,0" aria-label="Move right" title="Move right (→)">▶</button>
      <span></span><button type="button" data-pan="0,-1" aria-label="Move down" title="Move down (↓)">▼</button><span></span>
    </div>
    <div class="mini" id="miniWrap" title="Click or drag to jump around the map">
      <canvas id="mini" width="180" height="120" aria-label="Overview of the whole map"></canvas>
    </div>
    <div class="hint" id="hint">Drag, arrow keys or the pad to move · ⌘/Ctrl + scroll or pinch to zoom</div>
  </main>

  <aside class="insp" aria-label="Inspector">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tabStory" aria-selected="true">Storyline</button>
      <button type="button" role="tab" id="tabDetail" aria-selected="false">Details</button>
    </div>
    <div class="pane" id="paneStory"></div>
    <div class="pane" id="paneDetail" hidden></div>
  </aside>
</div>

<script>/*__ELK__*/</script>
<script>
const G = __GRAPH_JSON__;

/* ---------- indexes ---------- */
const N = new Map(G.nodes.map(n => [n.id, n]));
const OUT = new Map(), IN = new Map(), KIDS = new Map();
for (const n of G.nodes) { OUT.set(n.id, []); IN.set(n.id, []); }
for (const e of G.edges) { if (N.has(e.source) && N.has(e.target)) { OUT.get(e.source).push(e); IN.get(e.target).push(e); } }
for (const n of G.nodes) if (n.parent && N.has(n.parent)) {
  if (!KIDS.has(n.parent)) KIDS.set(n.parent, []);
  KIDS.get(n.parent).push(n.id);
}
for (const k of KIDS.values()) k.sort((a, b) => N.get(a).line - N.get(b).line);

const KIND = {
  entry: { label: "Entry point", color: "--entry" }, function: { label: "Function", color: "--fn" },
  method: { label: "Method", color: "--fn" }, class: { label: "Class", color: "--cls" },
  data: { label: "Data structure", color: "--data" },
};
const EDGE = {
  calls: "calls", creates: "creates", uses: "references type", has: "is made of",
  extends: "extends", maybe_calls: "probably calls (guessed by name)", raises: "raises",
};
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const disp = n => n.kind === "entry" ? n.name : n.kind === "class" || n.kind === "data" ? n.qualname : n.qualname + "()";
const dataWord = n => n.label || (n.kind === "data" ? (n.data_kind || "data") : "class");

const state = { view: null, selected: null, layout: null, tf: { x: 0, y: 0, k: 1 } };
const opt = { uses: true, guess: true, raises: false, files: false };
const ui = id => document.getElementById(id);

/* ---------- header, legend ---------- */
ui("rootName").textContent = G.root;
const s = G.stats;
ui("stats").innerHTML = [["files", s.files], ["lines", s.lines.toLocaleString()], ["functions", s.functions + s.methods],
  ["classes", s.classes], ["data", s.data], ["links", s.edges]].map(([k, v]) => `<span><strong>${v}</strong> ${k}</span>`).join("");
const fmtK = v => v >= 1000 ? (v / 1000).toFixed(v >= 10000 ? 0 : 1) + "k" : String(v);
const langs = Object.entries(G.languages || {});
if (langs.length) ui("langs").innerHTML = langs.slice(0, 6).map(([l, v]) =>
  `<span class="lang" title="${v.files} files">${esc(l)} <span>${fmtK(v.lines)}</span></span>`).join("");
if (G.repo?.web) {
  const a = ui("repoLink"); a.href = G.repo.web + (G.repo.sha ? "/tree/" + G.repo.sha : ""); a.textContent = G.repo.slug || G.repo.web; a.hidden = false;
  ui("rootName").hidden = true;
}
const srcUrl = n => G.repo?.web && G.repo?.sha ? `${G.repo.web}/blob/${G.repo.sha}/${(n.repo_path || n.file).split("/").map(encodeURIComponent).join("/")}#L${n.line}-L${n.end_line}` : null;
ui("legend").innerHTML =
  ["entry", "function", "class", "data"].map(k => `<span class="glyph" style="background:var(${KIND[k].color});justify-self:center"></span><span>${KIND[k].label}</span>`).join("") +
  Object.entries({ calls: "calls", creates: "creates", has: "is made of", uses: "references type", extends: "extends", maybe_calls: "guessed call", raises: "raises error" })
    .map(([t, l]) => `<svg width="34" height="10" class="edge ${t}"><path d="M2 5 H32"/></svg><span>${l}</span>`).join("");
if (G.warnings?.length) ui("warnings").textContent = G.warnings.length + " file(s) skipped: " + G.warnings.slice(0, 3).join("; ");

/* ---------- edges allowed by toggles ---------- */
function edgeOn(t) { return !((t === "uses" && !opt.uses) || (t === "maybe_calls" && !opt.guess) || (t === "raises" && !opt.raises)); }
function isAncestor(a, b) { let p = N.get(b)?.parent; while (p) { if (p === a) return true; p = N.get(p)?.parent; } return false; }

/* ---------- views ---------- */
const REACH = new Set(["calls", "creates", "maybe_calls", "has", "extends", "raises"]);
function reachFrom(root, maxDepth = Infinity) {
  const seen = new Map(), q = [];
  const add = (id, d) => {
    if (seen.has(id) || !N.has(id)) return;
    seen.set(id, d); q.push(id);
    const n = N.get(id);
    if (n.parent) add(n.parent, d);
    const kids = KIDS.get(id) || [];
    if (kids.length && kids.length <= 8) kids.forEach(k => add(k, d));
  };
  add(root, 0);
  while (q.length) {
    const id = q.shift(), d = seen.get(id);
    if (d >= maxDepth) continue;
    for (const e of OUT.get(id)) if (REACH.has(e.type) && edgeOn(e.type)) add(e.target, d + 1);
  }
  return new Set(seen.keys());
}
function flowDepth(root) {
  let full = 0, size = 0;
  for (let d = 1; d < 60; d++) { const s = reachFrom(root, d).size; if (s === size) break; size = s; full = d; }
  return full;
}
function autoDepth(root) {
  const full = flowDepth(root);
  let pick = Math.min(2, full);
  for (let d = 2; d <= full; d++) { if (reachFrom(root, d).size <= 60) pick = d; else break; }
  return { pick, full };

      const fw = Math.max(textW(header, MONO()) + 28, ...fields.map(f => textW(f, MONO_S()) + 28), 150);
      const head = 34 + fields.length * 17 + (fields.length ? 6 : 0);

  const pane = ui("paneStory");
  if (!rootId) {
    pane.innerHTML = `<p class="intro">Pick a starting point on the left, or click any box, to read the code as a story: what runs first, what it calls, and which data it touches.</p>`;
    return;
  }
  const steps = [], seen = new Set();
  const visit = id => {
    if (seen.has(id) || !N.has(id) || steps.length > 80) return;
    seen.add(id);
    const n = N.get(id);
    const parts = [], next = [];
    if (n.kind === "class" || n.kind === "data") {
      const kids = KIDS.get(id) || [];
      const what = n.kind === "data" ? `is ${n.data_kind === "enum" ? "an enum" : "a data structure"}` : "is a class";
      let txt = `${what}`;
      if (kids.length) {
        const vis = state.viewIds ? kids.filter(k => state.viewIds.has(k)) : kids;
        const shown = (vis.length ? vis : kids).slice(0, 6);
        txt += kids.length <= 6 ? ` holding ${joinList(kids.map(k => code(k)))}`
          : ` with ${kids.length} members, including ${joinList(shown.map(k => code(k)))}`;
      }
      const has = OUT.get(id).filter(e => e.type === "has").map(e => e.target);
      const ext = OUT.get(id).filter(e => e.type === "extends").map(e => e.target);
      if (ext.length) txt += `. It extends ${joinList(ext.map(code))}`;
      if (has.length) txt += `. It is made of ${joinList(has.map(code))}`;
      parts.push(txt + ".");
      next.push(...ext, ...has);
      const init = kids.find(k => N.get(k).name === "__init__");
      if (init) next.unshift(init);
    } else {
      const outs = OUT.get(id).filter(e => e.target !== id && edgeOn(e.type) && e.type !== "has" && e.type !== "extends")
        .sort((a, b) => a.line - b.line);
      const verbs = { calls: "calls", creates: "creates", maybe_calls: "probably calls", uses: "works with", raises: "can raise" };
      const action = outs.filter(e => e.type !== "uses"), types = outs.filter(e => e.type === "uses");
      const runs = [];
      for (const e of action) {
        const last = runs[runs.length - 1];
        if (last && last.v === e.type) last.t.push(e.target); else runs.push({ v: e.type, t: [e.target] });
      }
      if (runs.length) parts.push(runs.map((r, i) => (i ? "then " : "") + verbs[r.v] + " " + joinList(r.t.map(code))).join(", ") + ".");
      if (types.length) parts.push(`Works with ${joinList(types.map(e => code(e.target)))}.`);
      if (!outs.length) parts.push("Doesn't call anything else in this project.");
      next.push(...action.map(e => e.target), ...types.map(e => e.target));
    }
    steps.push({ id, text: parts.join(" ") });
    for (const t of next) visit(t);
  };
  const code = id => `<code data-go="${esc(id)}">${esc(disp(N.get(id)))}</code>`;
  visit(rootId);
  const root = N.get(rootId);
  pane.innerHTML = `<p class="intro">How <code>${esc(disp(root))}</code> runs, in call order. Steps follow the order calls appear in the source.</p>
    <ol class="story">${steps.map((s, i) => { const n = N.get(s.id); return `<li><span class="n">${i + 1}</span><div class="body">
      <span class="who" data-go="${esc(s.id)}" style="color:var(${KIND[n.kind].color})">${esc(disp(n))}</span><span class="where">${esc(n.file)}:${n.line}</span>
      <p>${s.text}</p></div></li>`; }).join("")}</ol>
    ${steps.length > 80 ? `<p class="intro">Story trimmed at 80 steps.</p>` : ""}`;
}
ui("paneStory").addEventListener("click", e => { const c = e.target.closest("[data-go]"); if (c) goTo(c.dataset.go); });

/* ---------- syntax highlighter (all supported languages) ---------- */
const KW = new Set(("False None True and as assert async await break class continue def del elif else except finally for from global " +
  "if import in is lambda nonlocal not or pass raise return try while with yield match case self cls " +
  "abstract boolean byte catch char const debugger default do double enum export extends final float function goto " +
  "implements instanceof int interface let long native new null package private protected public short static super " +
  "switch synchronized this throw throws transient typeof undefined var void volatile type readonly declare namespace " +
  "keyof never unknown any string number func go chan defer fallthrough map range select struct nil fn impl trait mut " +
  "pub use mod crate loop where unsafe dyn move ref Self begin end elsif unless until module then rescue ensure " +
  "echo foreach elseif endif endforeach include require require_once using sealed override virtual internal " +
  "event delegate operator implicit explicit get set init record true false val object when inline auto signed " +
  "unsigned sizeof typedef union extern register template typename").split(" "));
const RX_COMMENT = "\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/";
const RX_HASH = "|#(?!\\[)[^\\n]*";
const RX_STRING = "[rbfuRBFU]{0,2}(?:\"\"\"[\\s\\S]*?\"\"\"|'''[\\s\\S]*?'''|\"(?:\\\\.|[^\"\\\\\\n])*\"|'(?:\\\\.|[^'\\\\\\n])*'|`(?:\\\\.|[^`\\\\])*`)";
const RX_REST = "|(@[\\w.]+|#\\[[^\\]\\n]*\\])|\\b(\\d[\\d_]*\\.?\\d*(?:e[+-]?\\d+)?)\\b|\\b([A-Za-z_$][\\w$]*)\\b";
function highlightCode(src, start, lang) {
  const hash = !lang || /Python|Ruby|PHP|Shell/.test(lang);
  const re = new RegExp("(" + RX_COMMENT + (hash ? RX_HASH : "") + ")|(" + RX_STRING + ")" + RX_REST, "g");
  let html = "", last = 0, m, prevDef = false;
  while ((m = re.exec(src))) {
    html += esc(src.slice(last, m.index)); last = re.lastIndex;
    if (m[1]) html += `<span class="t-com">${esc(m[1])}</span>`;
    else if (m[2]) html += `<span class="t-str">${esc(m[2])}</span>`;
    else if (m[3]) html += `<span class="t-dec">${esc(m[3])}</span>`;
    else if (m[4]) html += `<span class="t-num">${esc(m[4])}</span>`;
    else if (m[5]) {
      if (prevDef) html += `<span class="t-def">${esc(m[5])}</span>`;
      else if (KW.has(m[5])) html += `<span class="t-kw">${esc(m[5])}</span>`;
      else html += esc(m[5]);
      prevDef = /^(def|class|function|func|fn|struct|interface|enum|trait|type|module|impl)$/.test(m[5]); continue;
    }
    prevDef = false;
  }
  html += esc(src.slice(last));
  return html.split("\n").map((l, i) => `<span class="l" data-n="${start + i}">${l || " "}</span>`).join("");
}

/* ---------- pan & zoom ---------- */
const svg = ui("canvas");
function applyTf() {
  const t = state.tf; vpEl.setAttribute("transform", `translate(${t.x} ${t.y}) scale(${t.k})`);
  drawMini();
}
function pan(dx, dy) { state.tf.x += dx; state.tf.y += dy; applyTf(); }
function fit(whole) {
  const r = state.layout; if (!r) return;
  const W = svg.clientWidth, H = svg.clientHeight;
  let k = Math.min(1.25, Math.min(W / r.width, H / r.height) * 0.96);
  const minRead = 0.62;
  if (!whole && k < minRead) {
    // Too small to read: keep text legible and start at the top of the story instead.
    k = minRead;
    const rootId = state.view?.id, p = rootId && POS.get(rootId);
    const cx = p ? p.x + p.w / 2 : r.width / 2;
    state.tf = { k, x: W / 2 - cx * k, y: 10 };
  } else {
    k = Math.max(0.08, k);
    state.tf = { k, x: (W - r.width * k) / 2, y: Math.max(0, (H - r.height * k) / 2) };
  }
  applyTf();
}
function centerOn(id) {
  const p = POS.get(id); if (!p) return;
  const W = svg.clientWidth, H = svg.clientHeight, k = Math.max(state.tf.k, 0.8);
  state.tf = { k, x: W / 2 - (p.x + p.w / 2) * k, y: H / 2 - (p.y + p.h / 2) * k };
  applyTf();
}
function zoomAt(f, cx, cy) {
  const t = state.tf, k = Math.min(3, Math.max(0.08, t.k * f));
  t.x = cx - (cx - t.x) * (k / t.k); t.y = cy - (cy - t.y) * (k / t.k); t.k = k; applyTf();
}
svg.addEventListener("wheel", e => {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) {  // pinch on a trackpad arrives as ctrl+wheel
    const r = svg.getBoundingClientRect();
    zoomAt(Math.exp(-e.deltaY * (e.ctrlKey && !e.metaKey ? 0.01 : 0.0025)), e.clientX - r.left, e.clientY - r.top);
  } else {                        // two-finger scroll / mouse wheel moves the map
    const lineMode = e.deltaMode === 1 ? 32 : 1;
    pan(-(e.shiftKey && !e.deltaX ? e.deltaY : e.deltaX) * lineMode, -(e.shiftKey && !e.deltaX ? 0 : e.deltaY) * lineMode);
  }
}, { passive: false });

/* arrow pad: click to nudge, hold to keep moving */
const STEP = 90;
let padTimer = null;
const stopPad = () => { clearInterval(padTimer); padTimer = null; };
document.querySelectorAll(".pad [data-pan]").forEach(b => {
  const [x, y] = b.dataset.pan.split(",").map(Number);
  b.addEventListener("pointerdown", e => {
    e.preventDefault(); pan(x * STEP, y * STEP); stopPad();
    padTimer = setInterval(() => pan(x * STEP / 4, y * STEP / 4), 40);
  });
  b.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pan(x * STEP, y * STEP); } });
});
["pointerup", "pointercancel", "pointerleave", "blur"].forEach(ev => window.addEventListener(ev, stopPad));
document.querySelectorAll(".pad button").forEach(b => b.addEventListener("pointerleave", stopPad));
ui("padHome").onclick = () => fit();

/* keyboard: arrows / WASD move (Shift = faster), + − zoom, 0 back to start, F fits everything */
document.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "select" || tag === "textarea" || e.metaKey || e.ctrlKey || e.altKey) return;
  const fast = e.shiftKey ? 4 : 1;
  const moves = { ArrowUp: [0, 1], ArrowDown: [0, -1], ArrowLeft: [1, 0], ArrowRight: [-1, 0],
                  w: [0, 1], s: [0, -1], a: [1, 0], d: [-1, 0] };
  const m = moves[e.key] || moves[e.key.toLowerCase?.()];
  const cx = svg.clientWidth / 2, cy = svg.clientHeight / 2;
  if (m) { e.preventDefault(); pan(m[0] * STEP * fast, m[1] * STEP * fast); }
  else if (e.key === "+" || e.key === "=") { e.preventDefault(); zoomAt(1.2, cx, cy); }
  else if (e.key === "-" || e.key === "_") { e.preventDefault(); zoomAt(1 / 1.2, cx, cy); }
  else if (e.key === "0") { e.preventDefault(); fit(); }
  else if (e.key === "f" || e.key === "F") { e.preventDefault(); fit(true); }
});

/* minimap: the whole layout in miniature, with the visible area outlined */
const mini = ui("mini"), mctx = mini.getContext("2d");
let miniScale = null;
function drawMini() {
  const r = state.layout; if (!r || !mctx) return;
  const dpr = window.devicePixelRatio || 1, W = 180, H = 120;
  if (mini.width !== W * dpr) { mini.width = W * dpr; mini.height = H * dpr; }
  mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  mctx.clearRect(0, 0, W, H);
  const s = Math.min(W / r.width, H / r.height);
  const ox = (W - r.width * s) / 2, oy = (H - r.height * s) / 2;
  miniScale = { s, ox, oy };
  const colors = { entry: css("--entry"), function: css("--fn"), method: css("--fn"), class: css("--cls"), data: css("--data") };
  for (const [id, p] of POS) {
    const n = N.get(id); if (!n) continue;
    const big = n.kind === "class" || n.kind === "data";
    mctx.globalAlpha = big ? 0.18 : 0.75;
    mctx.fillStyle = colors[n.kind] || css("--muted");
    mctx.fillRect(ox + p.x * s, oy + p.y * s, Math.max(1.5, p.w * s), Math.max(1.5, p.h * s));
  }
  mctx.globalAlpha = 1;
  const t = state.tf;
  const vx = ox + (-t.x / t.k) * s, vy = oy + (-t.y / t.k) * s;
  const vw = (svg.clientWidth / t.k) * s, vh = (svg.clientHeight / t.k) * s;
  mctx.strokeStyle = css("--ink"); mctx.lineWidth = 1.5;
  mctx.strokeRect(vx, vy, vw, vh);
  mctx.fillStyle = css("--fn"); mctx.globalAlpha = 0.08; mctx.fillRect(vx, vy, vw, vh); mctx.globalAlpha = 1;
}
function miniJump(e) {
  if (!miniScale) return;
  const b = mini.getBoundingClientRect();
  const mx = (e.clientX - b.left) * (180 / b.width), my = (e.clientY - b.top) * (120 / b.height);
  const lx = (mx - miniScale.ox) / miniScale.s, ly = (my - miniScale.oy) / miniScale.s;
  const t = state.tf;
  t.x = svg.clientWidth / 2 - lx * t.k; t.y = svg.clientHeight / 2 - ly * t.k;
  applyTf();
}
let miniDrag = false;
ui("miniWrap").addEventListener("pointerdown", e => { miniDrag = true; ui("miniWrap").setPointerCapture(e.pointerId); miniJump(e); });
ui("miniWrap").addEventListener("pointermove", e => { if (miniDrag) miniJump(e); });
ui("miniWrap").addEventListener("pointerup", () => { miniDrag = false; });
ui("miniWrap").addEventListener("pointercancel", () => { miniDrag = false; });
try { window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => drawMini()); } catch {}
let drag = null, moved = false;
const pointers = new Map();
svg.addEventListener("pointerdown", e => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  moved = false;
  drag = { x: e.clientX, y: e.clientY, tx: state.tf.x, ty: state.tf.y };
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; drag.pinch = Math.hypot(a.x - b.x, a.y - b.y); drag.k = state.tf.k; }
});
svg.addEventListener("pointermove", e => {
  if (!drag || !pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2 && drag.pinch) {
    const [a, b] = [...pointers.values()], r = svg.getBoundingClientRect();
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    zoomAt((drag.k * d / drag.pinch) / state.tf.k, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top);
    moved = true; return;
  }
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!moved && Math.hypot(dx, dy) < 4) return;
  if (!moved) { svg.setPointerCapture(e.pointerId); svg.classList.add("dragging"); }
  moved = true;
  state.tf.x = drag.tx + dx; state.tf.y = drag.ty + dy; applyTf();
});
const end = e => { pointers.delete(e.pointerId); if (!pointers.size) { drag = null; svg.classList.remove("dragging"); setTimeout(() => moved = false, 0); } };
svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", end);
ui("zIn").onclick = () => zoomAt(1.25, svg.clientWidth / 2, svg.clientHeight / 2);
ui("zOut").onclick = () => zoomAt(0.8, svg.clientWidth / 2, svg.clientHeight / 2);
ui("zFit").onclick = () => fit(true);
window.addEventListener("resize", () => fit());

/* ---------- toggles ---------- */
const prefs = (() => { try { return JSON.parse(localStorage.getItem("repomap.opt") || "{}"); } catch { return {}; } })();
Object.assign(opt, prefs);
ui("tUses").checked = opt.uses; ui("tGuess").checked = opt.guess; ui("tRaise").checked = opt.raises; ui("tFiles").checked = opt.files;
for (const [id, k] of [["tUses", "uses"], ["tGuess", "guess"], ["tRaise", "raises"], ["tFiles", "files"]]) {
  ui(id).addEventListener("change", () => {
    opt[k] = ui(id).checked;
    try { localStorage.setItem("repomap.opt", JSON.stringify(opt)); } catch {}
    if (state.view) setView(state.view, true);
  });
}

/* ---------- boot ---------- */
(async () => {
  try { await document.fonts.ready; } catch {}
  renderFlows();
  const first = defaultStart;
  if (first) setView(flowView(first.id));
  else setView({ type: "all" });
})();
</script>
